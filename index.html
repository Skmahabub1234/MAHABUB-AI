
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHABUB AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 background:#172438;padding:17px;
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid #34445b;
}
.logo{font-size:21px;font-weight:bold;color:#55baff}
.menu{font-size:25px;cursor:pointer}
.container{max-width:850px;margin:auto;padding:15px}
.welcome{text-align:center;padding:35px 10px 20px}
.orb{
 width:90px;height:90px;border-radius:50%;
 margin:auto auto 18px;
 background:radial-gradient(circle,#a9f2ff,#168bff,#112b54);
 box-shadow:0 0 35px #168bff;
}
.welcome h2{color:#66c5ff}
.welcome p{color:#aabbd0}
#chat{
 min-height:45vh;padding:10px 0 100px;
}
.message{
 padding:14px;margin:12px 0;
 border-radius:15px;line-height:1.7;
 white-space:pre-wrap;
}
.user{background:#244d78;margin-left:35px}
.bot{background:#1d2b40;margin-right:20px}
.input-area{
 position:fixed;bottom:0;left:0;right:0;
 background:#101827;padding:12px;
 border-top:1px solid #34445b;
}
.input-inner{
 max-width:850px;margin:auto;display:flex;
 gap:8px;align-items:center;
}
input{
 flex:1;min-width:0;padding:15px;
 border:1px solid #45617e;border-radius:15px;
 background:#1d2b40;color:white;font-size:16px;
}
button{
 border:0;border-radius:13px;padding:13px;
 background:#168bea;color:white;font-size:16px;
}
button:active{opacity:.7}
#status{text-align:center;color:#91b1d0;font-size:12px}
</style>
</head>
<body>

<header>
 <span class="logo">✦ MAHABUB AI</span>
 <span class="menu" onclick="clearChat()">＋</span>
</header>

<div class="container">
 <div class="welcome" id="welcome">
  <div class="orb"></div>
  <h2>স্বাগতম MAHABUB AI</h2>
  <p>আমি আপনার ব্যক্তিগত AI সহকারী।</p>
  <p>আপনি কী জানতে চান?</p>
 </div>

 <div id="chat"></div>
</div>

<div class="input-area">
 <div id="status">MAHABUB AI প্রস্তুত</div>
 <div class="input-inner">
  <button onclick="listen()">🎙️</button>
  <input id="question" placeholder="এখানে প্রশ্ন লিখুন..."
   onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">➤</button>
 </div>
</div>

<script>
const chat=document.getElementById("chat");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 window.scrollTo(0,document.body.scrollHeight);
}


function answer(q){
 const s=q.toLowerCase();

 if(s.includes("রাজধানী") && s.includes("বাংলাদেশ"))
  return "বাংলাদেশের রাজধানীর নাম ঢাকা।";

 if(s.includes("তোমার নাম") || s.includes("আপনার নাম"))
  return "আমার নাম MAHABUB AI।";

 if(s.includes("হ্যালো") || s.includes("হাই"))
  return "হ্যালো! আপনাকে স্বাগতম।";

 if(s.includes("কেমন আছ"))
  return "আমি ভালো আছি। আপনাকে কীভাবে সাহায্য করতে পারি?";

 if(s.includes("বাংলাদেশ"))
  return "বাংলাদেশ দক্ষিণ এশিয়ার একটি স্বাধীন দেশ।";

 if(s.includes("ধন্যবাদ"))
  return "আপনাকেও ধন্যবাদ!";

 return "দুঃখিত, এই প্রশ্নের উত্তর আমার ডেমো সংস্করণে নেই।";
}
 
function send(){
 const input=document.getElementById("question");
 const q=input.value.trim();
 if(!q)return;

 document.getElementById("welcome").style.display="none";
 addMessage(q,"user");
 input.value="";

 setTimeout(()=>{
  const a=answer(q);
  addMessage(a,"bot");
  window.lastAnswer=a;
 },400);
}

function speak(){
 if(!window.lastAnswer)return;
 const u=new SpeechSynthesisUtterance(window.lastAnswer);
 u.lang="bn-BD";
 speechSynthesis.speak(u);
}

function listen(){
 const SR=window.SpeechRecognition||
          window.webkitSpeechRecognition;
 if(!SR){
  document.getElementById("status").innerText=
   "এই ব্রাউজারে ভয়েস সুবিধা নেই।";
  return;
 }
 const r=new SR();
 r.lang="bn-BD";
 r.onstart=()=>{
  document.getElementById("status").innerText="শুনছি...";
 };
 r.onresult=e=>{
  document.getElementById("question").value=
   e.results[0][0].transcript;
  send();
 };
 r.onerror=()=>{
  document.getElementById("status").innerText=
   "মাইক্রোফোন অনুমতি পরীক্ষা করুন।";
 };
 r.onend=()=>{
  document.getElementById("status").innerText=
   "MAHABUB AI প্রস্তুত";
 };
 r.start();
}

function clearChat(){
 chat.innerHTML="";
 document.getElementById("welcome").style.display="block";
 window.lastAnswer="";
}
</script>

</body>
</html>
